[package]
name = "ecu-sim-driver"
version = "0.1.0"
edition = "2021"

[dependencies]
ecu-board-api = { path = "../ecu-board-api" }
ecu-board-profiles = { path = "../ecu-board-profiles" }
ecu-core = { path = "..", features = ["legacy-root-scheduler"] }
ecu-domain = { path = "../ecu-domain" }
ecu-io = { path = "../ecu-io" }
ecu-runtime = { path = "../ecu-runtime" }
ecu-sim = { path = "../ecu-sim" }
ecu-sim-core = { path = "../ecu-sim-core" }
ecu-sim-ffi = { path = "../ecu-sim-ffi" }
ecu-trigger = { path = "../ecu-trigger" }

[dev-dependencies]
ecu-sim-ffi = { path = "../ecu-sim-ffi", features = ["test-support"] }
