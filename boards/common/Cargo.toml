[package]
name = "ecu-target-common"
version = "0.1.0"
edition = "2021"

[lib]
name = "ecu_target_common"
path = "src/lib.rs"

[dependencies]
ecu-calibration = { path = "../../crates/calibration" }
ecu-compat = { path = "../../crates/compat", default-features = false, optional = true }
ecu-spec = { path = "../../crates/spec" }
ecu-transport = { path = "../../crates/transport", default-features = false, optional = true }
ecu-ts = { path = "../../crates/ts", default-features = false, features = ["runtime"] }
ecu-board-api = { path = "../../crates/board-api" }
ecu-domain = { path = "../../crates/domain" }
ecu-io = { path = "../../crates/io" }
ecu-runtime = { path = "../../crates/runtime" }
ecu-scheduler = { path = "../../crates/scheduler" }
ecu-trigger = { path = "../../crates/trigger" }
usb-device = { version = "0.3", optional = true }
usbd-serial = { version = "0.2", optional = true }
embedded-hal = "0.2"
embedded-hal-1 = { package = "embedded-hal", version = "1.0" }

[features]
default = []
transport-bbqueue = ["dep:ecu-transport", "ecu-transport/transport-bbqueue"]
transport-can = ["dep:ecu-compat", "dep:ecu-transport", "ecu-compat/transport-can", "ecu-transport/transport-can"]
transport-can-fd = ["transport-can", "ecu-compat/transport-can-fd", "ecu-transport/transport-can-fd"]
ts-usb = ["dep:usb-device", "dep:usbd-serial"]
test-support = []

[dev-dependencies]
ecu-compat = { path = "../../crates/compat", default-features = false }
