[package]
name = "ecu-target-common"
version = "0.1.0"
edition = "2021"

[lib]
name = "ecu_target_common"
path = "src/lib.rs"

[dependencies]
ecu-calibration = { path = "../../crates/calibration" }
ecu-ts = { path = "../../crates/ts", default-features = false, features = ["runtime"] }
ecu-board-api = { path = "../../crates/board-api" }
ecu-domain = { path = "../../crates/domain" }
ecu-io = { path = "../../crates/io" }
ecu-runtime = { path = "../../crates/runtime" }
ecu-scheduler = { path = "../../crates/scheduler" }
ecu-trigger = { path = "../../crates/trigger" }
usb-device = { version = "0.3", optional = true }
usbd-serial = { version = "0.2", optional = true }
embedded-hal = "0.2"
embedded-hal-1 = { package = "embedded-hal", version = "1.0" }

[features]
default = []
ts-usb = ["dep:usb-device", "dep:usbd-serial"]
test-support = []

[dev-dependencies]
ecu-core = { path = "../../crates/core", default-features = false }
