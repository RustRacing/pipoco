[workspace]
members = [
    "crates/*",
    "boards/*",
    "sim/*",
]
exclude = [
    "aidocs/*",
    "fuzz",
    "sim/avr-harness",
]
resolver = "2"

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization
strip = true         # Strip symbols
debug = true         # Keep debug info for embedded flashing
panic = "abort"

[profile.audit]
inherits = "release"
strip = false        # Keep symbols for cargo bloat / size inspection
lto = false          # Preserve symbol boundaries for analysis
debug = true

[profile.dev]
opt-level = 1
panic = "abort"
