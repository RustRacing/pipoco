[workspace]
members = [".", "stm32f4", "rp2350b", "rp2040-pico", "ecu-target-common"]
resolver = "2"

[package]
name = "ecu-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "ecu_core"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.0", default-features = false, features = ["use-crc"] }

# Transport
bbqueue = { version = "0.5", optional = true }

[features]
default = []
interp-bilinear = []
transport-bbqueue = ["bbqueue"]
transport-can = []
transport-can-fd = []
sched-simple = []

# For testing only - enables test helpers
test-utils = []

[dev-dependencies]
# Enable test-utils feature when running tests
# This allows integration tests to use create_test_pair()
ecu-target-common = { path = "./ecu-target-common" }

[[test]]
name = "transport_integration"
required-features = ["transport-bbqueue"]

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization
strip = true         # Strip symbols
