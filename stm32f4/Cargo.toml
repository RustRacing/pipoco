[package]
name = "stm32f4-ecu"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
ecu-core = { path = ".." }
ecu-calibration = { path = "../ecu-calibration" }
ecu-domain = { path = "../ecu-domain" }
ecu-io = { path = "../ecu-io" }
ecu-runtime = { path = "../ecu-runtime" }
ecu-scheduler = { path = "../ecu-scheduler" }
ecu-target-common = { path = "../ecu-target-common" }
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
# panic-never = "0.1" # BLOCKED: causes linker failure on this toolchain (see US-FM0290 blocker in tools/TOOLING.md)
stm32f4xx-hal = { version = "0.21", features = ["stm32f405", "otg-fs", "usb_fs"] }
embedded-hal = "0.2"
usb-device = { version = "0.3", optional = true }
usbd-serial = { version = "0.2", optional = true }

[[bin]]
name = "stm32f4-ecu"
path = "src/main.rs"

[features]
# Alternative trigger capture path using TIM2 CH1.
capture-tim = []
# Alternative trigger capture path using EXTI GPIO.
capture-gpio = []
transport-can = ["ecu-core/transport-can"]
transport-can-fd = ["transport-can", "ecu-core/transport-can-fd"]
# TunerStudio serial support through target-common.
ts-usb = ["usb-device", "usbd-serial", "ecu-target-common/ts-usb"]
# Flash-backed KV bring-up backend.
flash-kv = []
ts-usb-hw = ["ts-usb"]
adc-sensors = []
# Standalone example binaries.
example-bins = []

[[bin]]
name = "stm32f4-ecu-demo"
path = "src/bin/ecu_demo.rs"
required-features = ["example-bins"]

[[bin]]
name = "v8-seq"
path = "src/bin/v8_seq.rs"
required-features = ["example-bins"]

[[bin]]
name = "4c-batched"
path = "src/bin/4c_batched.rs"
required-features = ["example-bins"]

[[bin]]
name = "can-heartbeat"
path = "src/bin/can_heartbeat.rs"
required-features = ["example-bins", "transport-can"]

[[bin]]
name = "ts-gauges"
path = "src/bin/ts_gauges.rs"
required-features = ["example-bins"]
