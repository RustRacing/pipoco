[package]
name = "ecu-ts"
version = "0.1.0"
edition = "2021"

[dependencies]
ecu-runtime = { path = "../runtime", optional = true }
ecu-domain = { path = "../domain", optional = true }
ecu-calibration = { path = "../calibration" }

[features]
default = []
# Runtime/calibration-facing TS surfaces (snapshot adapter, calibration edit
# surface, expert-trigger page). Enable explicitly; the default is the
# protocol/server shell only.
calibration = []
runtime = ["dep:ecu-runtime", "dep:ecu-domain", "calibration"]
persistence = ["calibration"]

[lints]
workspace = true
