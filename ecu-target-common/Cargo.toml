[package]
name = "ecu-target-common"
version = "0.1.0"
edition = "2021"

[lib]
name = "ecu_target_common"
path = "src/lib.rs"

[dependencies]
ecu-core = { path = "..", default-features = false }
ecu-calibration = { path = "../ecu-calibration" }
ecu-domain = { path = "../ecu-domain" }
ecu-io = { path = "../ecu-io" }
ecu-runtime = { path = "../ecu-runtime" }
ecu-scheduler = { path = "../ecu-scheduler" }
ecu-trigger = { path = "../ecu-trigger" }
usb-device = { version = "0.3", optional = true }
usbd-serial = { version = "0.2", optional = true }
embedded-hal = "0.2"
embedded-hal-1 = { package = "embedded-hal", version = "1.0" }

[features]
default = []
ts-usb = ["dep:usb-device", "dep:usbd-serial"]
